<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#150a3a"/>
      <stop offset="100%" stop-color="#05010f"/>
    </radialGradient>
    <radialGradient id="ball" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#bffffb"/>
      <stop offset="50%" stop-color="#16f2e5"/>
      <stop offset="100%" stop-color="#0b7d78"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g stroke="#8a5cff" stroke-opacity="0.18" stroke-width="2">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <circle cx="256" cy="240" r="96" fill="url(#ball)" filter="url(#glow)"/>
  <circle cx="256" cy="240" r="150" fill="none" stroke="#ff2fd0" stroke-width="10" stroke-opacity="0.85" filter="url(#glow)"/>
</svg>
